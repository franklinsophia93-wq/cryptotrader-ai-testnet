name: CryptoTrader Research Tests
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Verify paper engine in Node
        run: node --test paper_core.test.mjs paper_health.test.mjs paper_signals.test.mjs adaptive_shadow_core.test.mjs adaptive_shadow_dashboard.test.mjs
